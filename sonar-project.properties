# ============================================================
# SonarCloud - Configuration globale du projet SMARTEK
# ============================================================
# Ce fichier est utilisé pour l'analyse du frontend Angular.
# Les services backend ont chacun leur propre sonar-project.properties.
#
# Secrets GitHub requis :
#   SONAR_TOKEN        → token généré sur sonarcloud.io
#   SONAR_ORGANIZATION → nom de l'organisation SonarCloud (ex: smartek-esprit)
# ============================================================

sonar.projectKey=${env.SONAR_ORGANIZATION}_smartek-frontend
sonar.projectName=Smartek Frontend (Angular)
sonar.organization=${env.SONAR_ORGANIZATION}

sonar.sources=Frontend/angular-app/src
sonar.exclusions=\
  Frontend/angular-app/src/**/*.spec.ts,\
  Frontend/angular-app/src/environments/**,\
  Frontend/angular-app/node_modules/**,\
  Frontend/angular-app/dist/**

sonar.tests=Frontend/angular-app/src
sonar.test.inclusions=Frontend/angular-app/src/**/*.spec.ts

sonar.javascript.lcov.reportPaths=Frontend/angular-app/coverage/angular-app/lcov.info
sonar.typescript.tsconfigPath=Frontend/angular-app/tsconfig.json

sonar.sourceEncoding=UTF-8
