# sonar-project.properties - Smartek Platform

sonar.projectKey=smartek-platform
sonar.organization=smartek
sonar.projectName=Smartek Platform
sonar.projectVersion=1.0

# Sources
sonar.sources=Backend,Frontend/angular-app/src

# Exclusions globales
sonar.exclusions=\
  **/target/**,\
  **/node_modules/**,\
  **/dist/**,\
  **/*.min.js,\
  **/generated/**,\
  **/*DTO.java,\
  **/*Entity.java,\
  **/*Config.java,\
  **/*Configuration.java,\
  **/db/migration/**,\
  **/*Application.java,\
  **/uploads/**

# Exclusions de couverture
sonar.coverage.exclusions=\
  **/*DTO.java,\
  **/*Entity.java,\
  **/*Config.java,\
  **/*Configuration.java,\
  **/*Application.java,\
  **/db/migration/**,\
  **/*Exception.java,\
  **/*Mapper.java

# Rapports JaCoCo
sonar.java.coveragePlugin=jacoco
sonar.coverage.jacoco.xmlReportPaths=\
  Backend/auth-service/target/site/jacoco/jacoco.xml,\
  Backend/event-service/target/site/jacoco/jacoco.xml,\
  Backend/planning-service/target/site/jacoco/jacoco.xml,\
  Backend/training-service/target/site/jacoco/jacoco.xml,\
  Backend/offers-service/target/site/jacoco/jacoco.xml,\
  Backend/course-service/target/site/jacoco/jacoco.xml,\
  Backend/exam-service/target/site/jacoco/jacoco.xml,\
  Backend/certification-badge-service/target/site/jacoco/jacoco.xml

# Rapport frontend (LCOV)
sonar.javascript.lcov.reportPaths=Frontend/angular-app/coverage/lcov.info

sonar.sourceEncoding=UTF-8
sonar.qualitygate.wait=false
