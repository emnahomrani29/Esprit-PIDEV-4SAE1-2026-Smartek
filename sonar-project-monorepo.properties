# ============================================================
# SonarCloud - Configuration MONOREPO pour tout le projet SMARTEK
# ============================================================
# Ce fichier analyse l'ensemble du projet (tous les microservices + frontend)
# en un seul projet SonarCloud unifié avec la branche principale "main".
# ============================================================

sonar.projectKey=${env.SONAR_ORGANIZATION}_smartek-esprit-monorepo
sonar.projectName=Smartek Esprit - Full Project
sonar.organization=${env.SONAR_ORGANIZATION}

# Sources - Tous les microservices (code de production uniquement)
sonar.sources=\
  Backend/auth-service/src/main,\
  Backend/course-service/src/main,\
  Backend/exam-service/src/main,\
  Backend/event-service/src/main,\
  Backend/offers-service/src/main,\
  Backend/planning-service/src/main,\
  Backend/training-service/src/main,\
  Backend/certification-badge-service/src/main,\
  Backend/skiil-evidence-service/src/main,\
  Backend/learning/src/main,\
  Backend/smartek_sponsor/src/main,\
  Frontend/angular-app/src/app

# Exclusions - Exclure les tests et fichiers générés pour rester sous la limite
sonar.exclusions=\
  **/target/**,\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/dto/**,\
  **/entity/**,\
  **/*Application.java,\
  **/migration/**,\
  **/db/migration/**,\
  **/*.spec.ts,\
  **/test/**,\
  **/tests/**,\
  **/environments/**,\
  **/uploads/**,\
  **/logs/**,\
  **/*.sql,\
  **/config/**

# Ne pas analyser les tests pour économiser les lignes de code
# Les tests représentent ~40-50% du code total

# Java configuration
sonar.java.binaries=**/target/classes
sonar.java.libraries=**/target/dependency/*.jar

# Coverage reports
sonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=Frontend/angular-app/coverage/angular-app/lcov.info

# TypeScript configuration
sonar.typescript.tsconfigPath=Frontend/angular-app/tsconfig.json

sonar.sourceEncoding=UTF-8
