jenkins:
  systemMessage: "🚀 Smartek ESPRIT - Jenkins CI/CD Server"
  numExecutors: 2
  mode: NORMAL
  scmCheckoutRetryCount: 3
  
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "admin123"
          name: "Administrator"
          description: "Jenkins Administrator"
  
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

  remotingSecurity:
    enabled: true

  crumbIssuer:
    standard:
      excludeClientIPFromCrumb: false

tool:
  git:
    installations:
      - name: "Default"
        home: "git"
  
  maven:
    installations:
      - name: "Maven-3.9"
        properties:
          - installSource:
              installers:
                - maven:
                    id: "3.9.6"
  
  jdk:
    installations:
      - name: "JDK-17"
        properties:
          - installSource:
              installers:
                - jdkInstaller:
                    id: "jdk-17.0.9+9"
  
  nodejs:
    installations:
      - name: "NodeJS-20"
        properties:
          - installSource:
              installers:
                - nodeJSInstaller:
                    id: "20.11.0"
                    npmPackagesRefreshHours: 72

unclassified:
  location:
    url: "http://localhost:8090/"
    adminAddress: "jenkins@smartek.esprit.tn"
  
  globalLibraries:
    libraries:
      - name: "smartek-pipeline-library"
        defaultVersion: "main"
        implicit: false
        allowVersionOverride: true
        retriever:
          modernSCM:
            scm:
              git:
                remote: "https://github.com/your-org/pipeline-library.git"

  sonarGlobalConfiguration:
    installations:
      - name: "SonarCloud"
        serverUrl: "https://sonarcloud.io"
        credentialsId: "sonar-token"

credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: "sonar-token"
              secret: "${SONAR_TOKEN}"
              description: "SonarCloud Token"
          - usernamePassword:
              scope: GLOBAL
              id: "github-token"
              username: "${GITHUB_USER}"
              password: "${GITHUB_TOKEN}"
              description: "GitHub Token"

jobs:
  - script: >
      multibranchPipelineJob('smartek-backend') {
        displayName('Smartek Backend Services')
        description('Pipeline pour tous les microservices Backend')
        branchSources {
          git {
            id('smartek-backend-repo')
            remote('https://github.com/your-org/smartek.git')
            credentialsId('github-token')
            includes('main develop feature/* hotfix/*')
          }
        }
        factory {
          workflowBranchProjectFactory {
            scriptPath('Jenkinsfile.backend')
          }
        }
        orphanedItemStrategy {
          discardOldItems {
            numToKeep(10)
          }
        }
        triggers {
          periodicFolderTrigger {
            interval('5m')
          }
        }
      }
  
  - script: >
      multibranchPipelineJob('smartek-frontend') {
        displayName('Smartek Frontend Angular')
        description('Pipeline pour l\'application Frontend Angular')
        branchSources {
          git {
            id('smartek-frontend-repo')
            remote('https://github.com/your-org/smartek.git')
            credentialsId('github-token')
            includes('main develop feature/* hotfix/*')
          }
        }
        factory {
          workflowBranchProjectFactory {
            scriptPath('Jenkinsfile.frontend')
          }
        }
        orphanedItemStrategy {
          discardOldItems {
            numToKeep(10)
          }
        }
        triggers {
          periodicFolderTrigger {
            interval('5m')
          }
        }
      }
