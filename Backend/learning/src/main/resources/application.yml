spring:
  application:
    name: learning

  datasource:
    url: jdbc:mysql://localhost:3306/smartek_learning?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  cloud:
    config:
      enabled: false

server:
  port: 8092

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: false
    hostname: localhost
    instance-id: ${spring.application.name}:${server.port}

# JWT (same secret as auth-service)
jwt:
  secret: smartek-secret-key-for-jwt-token-generation-2024-very-secure

# Logging
logging:
  level:
    com.smartek: DEBUG
