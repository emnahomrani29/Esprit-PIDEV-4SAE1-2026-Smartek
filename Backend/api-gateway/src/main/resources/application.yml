server:
  port: 8090

spring:
  application:
    name: api-gateway
  main:
    allow-bean-definition-overriding: true
  cloud:
    config:
      enabled: false
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 3600
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
        - id: certification-badge-service
          uri: lb://certification-badge-service
          predicates:
            - Path=/api/certifications-badges/**
        - id: offers-service
          uri: lb://offers-service
          predicates:
            - Path=/api/offers/**
        - id: applications-service
          uri: lb://offers-service
          predicates:
            - Path=/api/applications/**
        - id: interviews-service
          uri: lb://offers-service
          predicates:
            - Path=/api/interviews/**
        - id: interview-feedbacks-service
          uri: lb://offers-service
          predicates:
            - Path=/api/interview-feedbacks/**
        - id: saved-offers-service
          uri: lb://offers-service
          predicates:
            - Path=/api/saved-offers/**
        - id: course-service
          uri: lb://course-service
          predicates:
            - Path=/api/courses/**
        - id: training-service
          uri: lb://training-service
          predicates:
            - Path=/api/trainings/**,/api/training/**
        - id: exam-service
          uri: lb://exam-service
          predicates:
            - Path=/api/exams/**
        - id: exam-enrollments
          uri: lb://exam-service
          predicates:
            - Path=/api/exam-enrollments/**
        - id: exam-results
          uri: lb://exam-service
          predicates:
            - Path=/api/exam-results/**
        - id: exam-drafts
          uri: lb://exam-service
          predicates:
            - Path=/api/exam-drafts/**
        - id: analytics-exams
          uri: lb://exam-service
          predicates:
            - Path=/api/analytics/trainer/*/exams
        - id: analytics-training
          uri: lb://training-service
          predicates:
            - Path=/api/analytics/trainer/*/training**,/api/analytics/trainer/*/trainings
        - id: training-enrollments
          uri: lb://training-service
          predicates:
            - Path=/api/training-enrollments/**
        - id: performance-service
          uri: lb://training-service
          predicates:
            - Path=/api/performance/**
        - id: event-service
          uri: lb://event-service
          predicates:
            - Path=/events/**
        - id: event-business-service
          uri: lb://event-service
          predicates:
            - Path=/events/business/**
        - id: planning-service
          uri: lb://planning-service
          predicates:
            - Path=/plannings/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

jwt:
  secret: smartek-secret-key-for-jwt-token-generation-2024-very-secure