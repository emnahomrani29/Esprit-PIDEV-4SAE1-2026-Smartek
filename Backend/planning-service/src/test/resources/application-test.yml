spring:
  application:
    name: planning-service-test

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/testdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  flyway:
    enabled: false

  cloud:
    config:
      enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

jwt:
  secret: smartek-secret-key-for-jwt-token-generation-2024-very-secure

twilio:
  account-sid: test-sid
  auth-token: test-token
  phone-number: "+1234567890"
  enabled: false

auth-service:
  url: http://localhost:8081

logging:
  level:
    com.smartek: DEBUG
    org.springframework.security: WARN
