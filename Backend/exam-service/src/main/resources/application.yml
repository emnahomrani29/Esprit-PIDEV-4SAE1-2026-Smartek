server:
  port: 8087

spring:
  application:
    name: exam-service
  datasource:
    url: jdbc:mysql://localhost:3306/exam_db?createDatabaseIfNotExist=true
    username: root
    password: 
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
        jdbc:
          batch_size: 20
          fetch_size: 50
        order_inserts: true
        order_updates: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: false
    hostname: localhost
    instance-id: ${spring.application.name}:${server.port}

# JWT Configuration (même secret que l'auth-service)
jwt:
  secret: smartek-secret-key-for-jwt-token-generation-2024-very-secure

logging:
  level:
    com.smartek.examservice: DEBUG
    org.springframework.security: DEBUG
