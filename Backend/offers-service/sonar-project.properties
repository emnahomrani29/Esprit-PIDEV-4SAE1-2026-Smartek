# ── SonarQube — Configuration du projet offers-service ──────────────────
sonar.projectKey=offers-service
sonar.projectName=Offers Service
sonar.projectVersion=1.0.0

# Sources et tests
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

# Couverture JaCoCo
sonar.java.coveragePlugin=jacoco
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Exclusions (DTOs, entités, config — pas de logique métier)
sonar.exclusions=\
  **/dto/**,\
  **/entity/**,\
  **/config/**,\
  **/exception/GlobalExceptionHandler.java,\
  **/*Application.java

sonar.test.exclusions=**/test/**

# Encodage
sonar.sourceEncoding=UTF-8

# Qualité minimale (Quality Gate)
# Ces seuils sont vérifiés par le Quality Gate configuré dans SonarQube
# - Couverture de code : >= 60%
# - Duplications      : <= 3%
# - Bugs critiques    : 0
# - Vulnérabilités    : 0
