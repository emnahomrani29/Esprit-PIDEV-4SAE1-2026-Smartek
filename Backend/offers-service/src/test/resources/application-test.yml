spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  # Désactiver Redis pour les tests
  cache:
    type: simple

  # Désactiver Eureka pour les tests
  cloud:
    config:
      enabled: false

eureka:
  client:
    enabled: false

jwt:
  secret: test-secret-key-for-jwt-token-generation-2024-very-secure-test

logging:
  level:
    com.smartek: WARN
    org.springframework.security: WARN
