apiVersion: apps/v1
kind: Deployment
metadata:
  name: offers-service
  namespace: smartek
  labels:
    app: offers-service
    app.kubernetes.io/name: offers-service
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: smartek-platform
    app.kubernetes.io/managed-by: jenkins
  annotations:
    kubernetes.io/change-cause: "Initial deployment"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: offers-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0   # Zéro downtime
  template:
    metadata:
      labels:
        app: offers-service
        app.kubernetes.io/name: offers-service
        version: "1.0.0"
      annotations:
        # Prometheus scraping automatique via annotation
        prometheus.io/scrape: "true"
        prometheus.io/path:   "/actuator/prometheus"
        prometheus.io/port:   "8085"
    spec:
      # ── Sécurité du pod ──────────────────────────────────────────────
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      # ── Attendre que MySQL soit prêt avant de démarrer ───────────────
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z mysql-service 3306; do
                echo "⏳ Attente de MySQL..."; sleep 3
              done
              echo "✅ MySQL disponible."

      containers:
        - name: offers-service
          image: nexus:8082/smartek/offers-service:latest   # remplacé par Jenkins
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8085
              protocol: TCP

          # ── Variables d'environnement ──────────────────────────────
          envFrom:
            - configMapRef:
                name: offers-service-config
            - secretRef:
                name: offers-service-secret

          # ── Probes Kubernetes ──────────────────────────────────────
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8085
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 5

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8085
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5

          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12   # 12 × 10s = 2 min max au démarrage

          # ── Ressources ─────────────────────────────────────────────
          resources:
            requests:
              cpu:    "250m"
              memory: "256Mi"
            limits:
              cpu:    "500m"
              memory: "512Mi"

          # ── Sécurité du conteneur ──────────────────────────────────
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]

      # ── Politique de pull de l'image depuis Nexus ─────────────────
      imagePullSecrets:
        - name: nexus-registry-secret

      # ── Répartition sur les nœuds ─────────────────────────────────
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: [offers-service]
                topologyKey: kubernetes.io/hostname

      restartPolicy: Always
