# Ingress — exposition externe via NGINX Ingress Controller
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: offers-service-ingress
  namespace: smartek
  labels:
    app: offers-service
    app.kubernetes.io/part-of: smartek-platform
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout:    "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout:    "60"
spec:
  ingressClassName: nginx
  rules:
    - host: api.smartek.local   # remplacer par le domaine réel
      http:
        paths:
          - path: /api/offers
            pathType: Prefix
            backend:
              service:
                name: offers-service
                port:
                  number: 8085
          - path: /api/applications
            pathType: Prefix
            backend:
              service:
                name: offers-service
                port:
                  number: 8085
          - path: /api/interviews
            pathType: Prefix
            backend:
              service:
                name: offers-service
                port:
                  number: 8085
