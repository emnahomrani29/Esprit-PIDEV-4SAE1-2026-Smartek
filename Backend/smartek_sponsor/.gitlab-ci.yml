# GitLab CI/CD Pipeline for Smartek Sponsor Service
# Alternative to Jenkins for GitLab users

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  DOCKER_REGISTRY: "your-nexus-registry:8083"
  DOCKER_IMAGE: "${DOCKER_REGISTRY}/smartek-sponsor"
  SONAR_HOST_URL: "http://your-sonarqube-server:9000"
  K8S_NAMESPACE: "smartek-production"

stages:
  - build
  - test
  - quality
  - package
  - docker
  - deploy

cache:
  paths:
    - .m2/repository
    - target/

# Build Stage
build:
  stage: build
  image: maven:3.9.6-eclipse-temurin-17
  script:
    - cd Backend/smartek_sponsor
    - mvn clean compile
  artifacts:
    paths:
      - Backend/smartek_sponsor/target/
    expire_in: 1 hour

# Test Stage
test:
  stage: test
  image: maven:3.9.6-eclipse-temurin-17
  script:
    - cd Backend/smartek_sponsor
    - mvn test
  artifacts:
    reports:
      junit:
        - Backend/smartek_sponsor/target/surefire-reports/TEST-*.xml
    paths:
      - Backend/smartek_sponsor/target/site/jacoco/
    expire_in: 1 day
  coverage: '/Total.*?([0-9]{1,3})%/'

# SonarQube Analysis
sonarqube:
  stage: quality
  image: maven:3.9.6-eclipse-temurin-17
  script:
    - cd Backend/smartek_sponsor
    - mvn sonar:sonar
        -Dsonar.projectKey=smartek-sponsor
        -Dsonar.host.url=${SONAR_HOST_URL}
        -Dsonar.login=${SONAR_TOKEN}
  only:
    - main
    - develop

# Package Stage
package:
  stage: package
  image: maven:3.9.6-eclipse-temurin-17
  script:
    - cd Backend/smartek_sponsor
    - mvn package -DskipTests
  artifacts:
    paths:
      - Backend/smartek_sponsor/target/*.jar
    expire_in: 1 week

# Docker Build and Push
docker:
  stage: docker
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - docker login -u ${NEXUS_USER} -p ${NEXUS_PASSWORD} ${DOCKER_REGISTRY}
  script:
    - cd Backend/smartek_sponsor
    - export BUILD_TAG="${CI_COMMIT_SHORT_SHA}-${CI_PIPELINE_ID}"
    - docker build -t ${DOCKER_IMAGE}:${BUILD_TAG} .
    - docker build -t ${DOCKER_IMAGE}:latest .
    - docker push ${DOCKER_IMAGE}:${BUILD_TAG}
    - docker push ${DOCKER_IMAGE}:latest
  only:
    - main

# Deploy to Kubernetes
deploy:
  stage: deploy
  image: bitnami/kubectl:latest
  before_script:
    - mkdir -p ~/.kube
    - echo "${KUBECONFIG}" | base64 -d > ~/.kube/config
  script:
    - export BUILD_TAG="${CI_COMMIT_SHORT_SHA}-${CI_PIPELINE_ID}"
    - kubectl set image deployment/smartek-sponsor-deployment
        smartek-sponsor=${DOCKER_IMAGE}:${BUILD_TAG}
        -n ${K8S_NAMESPACE}
    - kubectl rollout status deployment/smartek-sponsor-deployment
        -n ${K8S_NAMESPACE}
        --timeout=5m
  only:
    - main
  when: manual
