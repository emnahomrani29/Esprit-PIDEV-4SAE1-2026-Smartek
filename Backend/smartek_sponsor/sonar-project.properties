# SonarQube Project Configuration
sonar.projectKey=smartek-sponsor
sonar.projectName=Smartek Sponsor Service
sonar.projectVersion=0.0.1-SNAPSHOT

# Source code location
sonar.sources=src/main/java
sonar.tests=src/test/java

# Java version
sonar.java.source=17
sonar.java.target=17

# Encoding
sonar.sourceEncoding=UTF-8

# Coverage
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.java.coveragePlugin=jacoco

# Binaries
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

# Libraries
sonar.java.libraries=target/**/*.jar

# Exclusions
sonar.exclusions=**/config/**,**/dto/**,**/entity/**,**/enums/**
sonar.test.exclusions=**/test/**

# Code Smells
sonar.issue.ignore.multicriteria=e1,e2

# Ignore TODO comments
sonar.issue.ignore.multicriteria.e1.ruleKey=java:S1135
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.java

# Ignore System.out.println in test files
sonar.issue.ignore.multicriteria.e2.ruleKey=java:S106
sonar.issue.ignore.multicriteria.e2.resourceKey=**/test/**/*.java

# Quality Gate
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
