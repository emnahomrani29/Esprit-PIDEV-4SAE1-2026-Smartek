spring:
  application:
    name: certification-badge-service
  
  datasource:
    url: jdbc:mysql://localhost:3306/smartek_certification?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: root
    password: 
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  
  flyway:
    enabled: false
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: false
  
  cloud:
    config:
      enabled: false
  
  # CORS Configuration
  web:
    cors:
      allowed-origins: "*"
      allowed-methods: GET, POST, PUT, DELETE, OPTIONS, PATCH
      allowed-headers: "*"
      allow-credentials: true

  # Mail Configuration (Mailtrap SMTP for development)
  mail:
    host: sandbox.smtp.mailtrap.io
    port: 2525
    username: your_mailtrap_username
    password: your_mailtrap_password
    from: noreply@smartek.com
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8094

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
    registry-fetch-interval-seconds: 30
    # Retry settings for registration failures
    initial-instance-info-replication-interval-seconds: 10
    instance-info-replication-interval-seconds: 10
  instance:
    prefer-ip-address: true
    # Heartbeat interval (30 seconds)
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

# Logging
logging:
  level:
    com.smartek: DEBUG
    org.springframework.security: DEBUG

# Spring Boot Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  health:
    db:
      enabled: true
    mail:
      enabled: false

# JWT Configuration (align with Auth Service)
jwt:
  secret: smartek-secret-key-for-jwt-token-generation-2024-very-secure
  expiration: 86400000

# Internal API key for service-to-service integration (Exam Service)
internal:
  api-key: exam-service-dev-key

# Auth Service base URL (for Feign client to fetch user email)
auth-service:
  base-url: http://localhost:8081

# Certificate settings
certificate:
  keystore:
    path: smartek-keystore.p12
    password: smartek123
    alias: smartek
  verification:
    base-url: http://localhost:8083

pdf:
  signing:
    keystore-path: smartek-keystore.p12
    keystore-password: smartek123
    key-alias: smartek
    password: smartek123
    alias: smartek
  verification:
    base-url: http://192.168.1.16:8083
