        max-file: "3"
    networks:
      - smartek-network

  # ─────────────────────────────────────────
  # TRAINING SERVICE
  # ─────────────────────────────────────────
  training-service:
    build:
      context: ./Backend/training-service
      dockerfile: Dockerfile
    container_name: smartek-training
    restart: unless-stopped
