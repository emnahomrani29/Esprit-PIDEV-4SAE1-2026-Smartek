name: SonarCloud Monorepo Analysis

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'

jobs:
  sonar-monorepo:
    name: "SonarCloud - Full Project Analysis"
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: testdb
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
        ports:
          - 3306:3306

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings>
            <mirrors>
              <mirror>
                <id>maven-default-http-blocker</id>
                <mirrorOf>external:http:*</mirrorOf>
                <name>Pseudo repository to mirror external repositories initially using HTTP.</name>
                <url>http://0.0.0.0/</url>
                <blocked>true</blocked>
              </mirror>
            </mirrors>
            <profiles>
              <profile>
                <id>default</id>
                <repositories>
                  <repository>
                    <id>central</id>
                    <url>https://repo1.maven.org/maven2</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>false</enabled></snapshots>
                  </repository>
                </repositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>default</activeProfile>
            </activeProfiles>
          </settings>
          EOF

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Frontend/angular-app/package-lock.json

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -u root -proot --silent 2>/dev/null; then
              echo "MySQL ready"
              break
            fi
            sleep 2
          done

      # Build all backend services
      - name: Build all backend services
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/testdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
        run: |
          services=(
            "auth-service"
            "certification-badge-service"
            "course-service"
            "event-service"
            "exam-service"
            "learning"
            "offers-service"
            "planning-service"
            "skiil-evidence-service"
            "smartek_sponsor"
            "training-service"
          )
          
          for service in "${services[@]}"; do
            echo "Building $service..."
            cd Backend/$service
            mvn clean compile -B --no-transfer-progress -DskipTests || echo "Failed to build $service"
            cd ../..
          done

      # Build frontend (without running tests to save time)
      - name: Build frontend
        working-directory: Frontend/angular-app
        run: |
          npm ci
          npm run build --configuration production || echo "Frontend build failed"

      # Collect all coverage reports
      - name: Prepare for SonarCloud
        run: |
          echo "Preparing SonarCloud analysis - analyzing production code only"

      # SonarCloud analysis for entire project (production code only)
      - name: SonarCloud Full Project Analysis
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ secrets.SONAR_ORGANIZATION }}_smartek-esprit-monorepo
            -Dsonar.projectName="Smartek Esprit - Full Project"
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.sources=Backend/auth-service/src/main,Backend/certification-badge-service/src/main,Backend/course-service/src/main,Backend/event-service/src/main,Backend/exam-service/src/main,Backend/learning/src/main,Backend/offers-service/src/main,Backend/planning-service/src/main,Backend/skiil-evidence-service/src/main,Backend/smartek_sponsor/src/main,Backend/training-service/src/main,Frontend/angular-app/src/app
            -Dsonar.exclusions=**/target/**,**/node_modules/**,**/dist/**,**/dto/**,**/entity/**,**/*Application.java,**/migration/**,**/*.spec.ts,**/test/**,**/tests/**,**/environments/**,**/uploads/**,**/logs/**,**/*.sql
            -Dsonar.java.binaries=**/target/classes
            -Dsonar.sourceEncoding=UTF-8
