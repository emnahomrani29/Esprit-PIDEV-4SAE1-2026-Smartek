name: SonarCloud Analysis (Per Service)

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "event/**"
  pull_request:
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:

env:
  JAVA_VERSION: '17'

jobs:

  # ─────────────────────────────────────────────────────────────
  # BACKEND — un job par service Spring Boot
  # ─────────────────────────────────────────────────────────────
  sonar-backend:
    name: "SonarCloud — ${{ matrix.service }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth-service
          - service: certification-badge-service
          - service: course-service
          - service: event-service
          - service: exam-service
          - service: learning
          - service: offers-service
          - service: planning-service
          - service: skiil-evidence-service
          - service: smartek_sponsor
          - service: training-service

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: testdb
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
        ports:
          - 3306:3306

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings>
            <mirrors>
              <mirror>
                <id>maven-default-http-blocker</id>
                <mirrorOf>external:http:*</mirrorOf>
                <name>Pseudo repository to mirror external repositories initially using HTTP.</name>
                <url>http://0.0.0.0/</url>
                <blocked>true</blocked>
              </mirror>
            </mirrors>
            <profiles>
              <profile>
                <id>default</id>
                <repositories>
                  <repository>
                    <id>central</id>
                    <url>https://repo1.maven.org/maven2</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>false</enabled></snapshots>
                  </repository>
                </repositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>default</activeProfile>
            </activeProfiles>
          </settings>
          EOF

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -u root -proot --silent 2>/dev/null; then
              echo "MySQL ready"
              break
            fi
            sleep 2
          done

      - name: Build & generate coverage
        working-directory: Backend/${{ matrix.service }}
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/testdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
        run: mvn verify -B --no-transfer-progress

      - name: SonarCloud analysis
        working-directory: Backend/${{ matrix.service }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=${{ secrets.SONAR_ORGANIZATION }}_smartek-${{ matrix.service }} \
            -Dsonar.projectName="Smartek Esprit - ${{ matrix.service }}" \
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }} \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.java.binaries=target/classes \
            -Dsonar.sources=src/main/java \
            -Dsonar.tests=src/test/java \
            -Dsonar.exclusions="**/dto/**,**/entity/**,**/config/**,**/*Application.java,**/migration/**" \
            -Dsonar.qualitygate.wait=false
            -B --no-transfer-progress

  # ─────────────────────────────────────────────────────────────
  # FRONTEND — Angular
  # ─────────────────────────────────────────────────────────────
  sonar-frontend:
    name: "SonarCloud — Frontend Angular"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Frontend/angular-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Frontend/angular-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: |
          npm test -- \
            --watch=false \
            --browsers=ChromeHeadless \
            --no-progress \
            --code-coverage

      - name: SonarCloud analysis
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: Frontend/angular-app
          args: >
            -Dsonar.projectKey=${{ secrets.SONAR_ORGANIZATION }}_smartek-frontend
            -Dsonar.projectName="Smartek Esprit - Frontend"
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.sources=src
            -Dsonar.exclusions=src/**/*.spec.ts,src/environments/**,node_modules/**,dist/**
            -Dsonar.tests=src
            -Dsonar.test.inclusions=src/**/*.spec.ts
            -Dsonar.javascript.lcov.reportPaths=coverage/angular-app/lcov.info
            -Dsonar.typescript.tsconfigPath=tsconfig.json
