name: Offers Service CI/CD

"on":
  push:
    branches: [ main, develop, offers-service ]
    paths:
      - 'Backend/offers-service/**'
      - '.github/workflows/offers-service-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'Backend/offers-service/**'

env:
  SERVICE_DIR:  Backend/offers-service
  IMAGE_NAME:   smartek/offers-service
  NEXUS_REPO:   nexus:8082

jobs:

  # ── 1. GIT DIFF — Détection des changements ──────────────────────────
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      service_changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # nécessaire pour git diff HEAD~1

      - name: Check if offers-service changed
        id: check
        run: |
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD || git diff --name-only HEAD)
          echo "Fichiers modifiés :"
          echo "$CHANGED_FILES"
          
          if echo "$CHANGED_FILES" | grep -q "^Backend/offers-service/"; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✅ Changements détectés dans offers-service"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "⏭️  Aucun changement dans offers-service"
          fi

  # ── 2. BUILD & TESTS ──────────────────────────────────────────────────
  build-and-test:
    name: Build · Tests · SonarQube
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.service_changed == 'true' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # requis pour SonarQube (historique complet)

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build (sans tests)
        run: mvn clean package -DskipTests -B
        working-directory: ${{ env.SERVICE_DIR }}

      - name: Tests unitaires + couverture JaCoCo
        run: mvn verify -Dspring.profiles.active=test -B
        working-directory: ${{ env.SERVICE_DIR }}

      - name: Analyse de code — SonarQube
        if: ${{ secrets.SONAR_TOKEN != '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=offers-service \
            -Dsonar.projectName="Offers Service" \
            -Dsonar.java.coveragePlugin=jacoco \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -B
        working-directory: ${{ env.SERVICE_DIR }}

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offers-service-surefire-reports
          path: ${{ env.SERVICE_DIR }}/target/surefire-reports/
          retention-days: 7

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offers-service-jacoco-report
          path: ${{ env.SERVICE_DIR }}/target/site/jacoco/
          retention-days: 7

  # ── 3. NEXUS — Stockage du JAR (Maven Repository) ────────────────────
  publish-artifact:
    name: Publish JAR → Nexus
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Deploy JAR vers Nexus
        env:
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASS: ${{ secrets.NEXUS_PASS }}
          NEXUS_URL:  ${{ secrets.NEXUS_URL }}
        run: |
          mvn deploy -DskipTests -B \
            -DaltDeploymentRepository=nexus::default::${NEXUS_URL}/repository/smartek-releases/
        working-directory: ${{ env.SERVICE_DIR }}

  # ── 4. DOCKER — Build & Push vers Nexus Registry ─────────────────────
  build-and-push-docker:
    name: Docker Build & Push → Nexus
    runs-on: ubuntu-latest
    needs: publish-artifact
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Nexus Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.NEXUS_REGISTRY }}
          username: ${{ secrets.NEXUS_USER }}
          password: ${{ secrets.NEXUS_PASS }}

      - name: Build & Push image versionnée
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.SERVICE_DIR }}
          file: ${{ env.SERVICE_DIR }}/Dockerfile
          push: true
          tags: |
            ${{ secrets.NEXUS_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ secrets.NEXUS_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 5. KUBERNETES — Déploiement (kubeadm / Ubuntu) ───────────────────
  deploy:
    name: Deploy → Kubernetes
    runs-on: ubuntu-latest
    needs: build-and-push-docker
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Déployer l'image sur le cluster
        run: |
          kubectl set image deployment/offers-service \
            offers-service=${{ secrets.NEXUS_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -n smartek

          kubectl rollout status deployment/offers-service \
            -n smartek \
            --timeout=120s

      # ── 6. PROMETHEUS & GRAFANA — Vérification post-déploiement ──────
      - name: Vérifier les métriques Actuator (Prometheus)
        run: |
          sleep 15
          kubectl run probe --image=curlimages/curl --restart=Never --rm -i \
            -- curl -sf http://offers-service.smartek.svc.cluster.local:8085/actuator/health \
            && echo "✅ Service opérationnel — métriques disponibles sur /actuator/prometheus"
        continue-on-error: true
