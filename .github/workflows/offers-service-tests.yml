name: Offers Service CI

on:
  push:
    branches: [ main, develop, offers-service ]
    paths:
      - 'Backend/offers-service/**'
      - '.github/workflows/offers-service-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'Backend/offers-service/**'

jobs:
  # ─────────────────────────────────────────────
  # JOB 1 : Tests backend + couverture JaCoCo
  # ─────────────────────────────────────────────
  test-backend:
    name: Backend Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests with coverage
        run: mvn verify -Dspring.profiles.active=test -B
        working-directory: Backend/offers-service

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offers-service-surefire-reports
          path: Backend/offers-service/target/surefire-reports/
          retention-days: 7

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offers-service-jacoco-report
          path: Backend/offers-service/target/site/jacoco/
          retention-days: 7

  # ─────────────────────────────────────────────
  # JOB 2 : Build Docker image
  # ─────────────────────────────────────────────
  build-docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: Backend/offers-service
          file: Backend/offers-service/Dockerfile
          push: false
          tags: smartek/offers-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
