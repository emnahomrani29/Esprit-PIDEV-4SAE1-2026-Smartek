name: Offers Service CI/CD

# ═══════════════════════════════════════════════════════════════════════════
#  Stack : GitHub Actions · Docker · Nexus · kubeadm/Ubuntu
#          Prometheus · Grafana · SonarQube
# ═══════════════════════════════════════════════════════════════════════════

on:
  push:
    branches: [main, develop, offers-service]
    paths:
      - 'Backend/offers-service/**'
      - '.github/workflows/offers-service-tests.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'Backend/offers-service/**'

env:
  SERVICE_DIR:  Backend/offers-service
  IMAGE_NAME:   smartek/offers-service
  JAVA_VERSION: '17'

jobs:

  # ── 1. DÉTECTION DES CHANGEMENTS (Git Diff) ──────────────────────────
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      service_changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if offers-service changed
        id: check
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git diff --name-only HEAD)
          echo "Fichiers modifiés :"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -q "^Backend/offers-service/"; then
            echo "changed=true"  >> $GITHUB_OUTPUT
            echo "✅ Changements détectés dans offers-service"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "⏭️  Aucun changement dans offers-service"
          fi

  # ── 2. BUILD · TESTS · SONARQUBE ─────────────────────────────────────
  build-and-test:
    name: Build · Tests · SonarQube
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.service_changed == 'true' ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # requis pour SonarQube (historique complet)

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Build (sans tests)
        run: mvn clean package -DskipTests -B --no-transfer-progress
        working-directory: ${{ env.SERVICE_DIR }}

      - name: Tests unitaires + couverture JaCoCo
        run: mvn verify -Dspring.profiles.active=test -B --no-transfer-progress
        working-directory: ${{ env.SERVICE_DIR }}

      - name: Analyse SonarQube
        env:
          SONAR_TOKEN:    ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "⚠️  SONAR_TOKEN non configuré — analyse ignorée"
            exit 0
          fi
          mvn sonar:sonar \
            -Dsonar.projectKey=offers-service \
            -Dsonar.projectName="Offers Service" \
            -Dsonar.java.coveragePlugin=jacoco \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.exclusions="**/dto/**,**/entity/**,**/config/**" \
            -B --no-transfer-progress
        working-directory: ${{ env.SERVICE_DIR }}

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offers-service-surefire-reports
          path: ${{ env.SERVICE_DIR }}/target/surefire-reports/
          retention-days: 7

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offers-service-jacoco-report
          path: ${{ env.SERVICE_DIR }}/target/site/jacoco/
          retention-days: 7

  # ── 3. NEXUS — Publication du JAR ────────────────────────────────────
  publish-artifact:
    name: Publish JAR → Nexus
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Deploy JAR → Nexus Maven Repository
        env:
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASS: ${{ secrets.NEXUS_PASS }}
          NEXUS_URL:  ${{ secrets.NEXUS_URL }}
        run: |
          mvn deploy -DskipTests -B --no-transfer-progress \
            -DaltDeploymentRepository=nexus::default::${NEXUS_URL}/repository/smartek-releases/
        working-directory: ${{ env.SERVICE_DIR }}

  # ── 4. DOCKER — Build & Push vers Nexus Registry ─────────────────────
  build-and-push-docker:
    name: Docker Build & Push → Nexus
    runs-on: ubuntu-latest
    needs: publish-artifact
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Nexus Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.NEXUS_REGISTRY }}
          username: ${{ secrets.NEXUS_USER }}
          password: ${{ secrets.NEXUS_PASS }}

      - name: Build & Push image
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.SERVICE_DIR }}
          file:    ${{ env.SERVICE_DIR }}/Dockerfile
          push: true
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            GIT_COMMIT=${{ github.sha }}
          tags: |
            ${{ secrets.NEXUS_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ secrets.NEXUS_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ── 5. KUBERNETES — Déploiement (kubeadm / Ubuntu) ───────────────────
  deploy:
    name: Deploy → Kubernetes
    runs-on: ubuntu-latest
    needs: build-and-push-docker
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Appliquer les manifests Kubernetes
        run: |
          kubectl apply -f Backend/offers-service/k8s/configmap.yml
          kubectl apply -f Backend/offers-service/k8s/deployment.yml
          kubectl apply -f Backend/offers-service/k8s/service.yml
          kubectl apply -f Backend/offers-service/k8s/hpa.yml
          kubectl apply -f Backend/offers-service/k8s/servicemonitor.yml

      - name: Mise à jour de l'image
        run: |
          kubectl set image deployment/offers-service \
            offers-service=${{ secrets.NEXUS_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -n smartek

          kubectl annotate deployment/offers-service \
            kubernetes.io/change-cause="GitHub Actions run ${{ github.run_number }} — ${{ github.sha }}" \
            -n smartek --overwrite

          kubectl rollout status deployment/offers-service \
            -n smartek --timeout=180s

      # ── 6. HEALTH CHECK — Prometheus / Grafana ───────────────────────
      - name: Health Check (Prometheus metrics)
        run: |
          sleep 20
          kubectl run probe-${{ github.run_number }} \
            --image=curlimages/curl:8.5.0 \
            --restart=Never --rm -i \
            -n smartek \
            -- sh -c '
              echo "--- /actuator/health ---"
              curl -sf http://offers-service.smartek.svc.cluster.local:8085/actuator/health
              echo ""
              echo "--- /actuator/prometheus (extrait) ---"
              curl -sf http://offers-service.smartek.svc.cluster.local:8085/actuator/prometheus | head -10
              echo "✅ Métriques Prometheus disponibles"
            '
        continue-on-error: true

      - name: Rollback si échec
        if: failure()
        run: |
          echo "⚠️  Rollback automatique..."
          kubectl rollout undo deployment/offers-service -n smartek
