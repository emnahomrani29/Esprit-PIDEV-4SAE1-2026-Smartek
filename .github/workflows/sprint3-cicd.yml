name: Sprint 3 - CI/CD Pipeline

on:
  push:
    branches:
      - main
      - training-cours-exams-service
      - event/planning-service
  pull_request:
    branches:
      - main

jobs:

  # ─────────────────────────────────────────────────────────────
  # CI — Backend : event-service
  # ─────────────────────────────────────────────────────────────
  test-event-service:
    name: "CI - event-service (tests + JaCoCo)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests + coverage
        run: mvn verify -B
        working-directory: Backend/event-service

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-event-service
          path: Backend/event-service/target/site/jacoco/

      - name: Upload Surefire report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-event-service
          path: Backend/event-service/target/surefire-reports/

  # ─────────────────────────────────────────────────────────────
  # CI — Backend : training-service
  # ─────────────────────────────────────────────────────────────
  test-training-service:
    name: "CI - training-service (tests + JaCoCo)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests + coverage
        run: mvn verify -B
        working-directory: Backend/training-service

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-training-service
          path: Backend/training-service/target/site/jacoco/

      - name: Upload Surefire report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-training-service
          path: Backend/training-service/target/surefire-reports/

  # ─────────────────────────────────────────────────────────────
  # CI — Backend : course-service
  # ─────────────────────────────────────────────────────────────
  test-course-service:
    name: "CI - course-service (tests + JaCoCo)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests + coverage
        run: mvn verify -B
        working-directory: Backend/course-service

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-course-service
          path: Backend/course-service/target/site/jacoco/

      - name: Upload Surefire report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-course-service
          path: Backend/course-service/target/surefire-reports/

  # ─────────────────────────────────────────────────────────────
  # CI — Backend : exam-service
  # ─────────────────────────────────────────────────────────────
  test-exam-service:
    name: "CI - exam-service (tests + JaCoCo)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests + coverage
        run: mvn verify -B
        working-directory: Backend/exam-service

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-exam-service
          path: Backend/exam-service/target/site/jacoco/

      - name: Upload Surefire report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-exam-service
          path: Backend/exam-service/target/surefire-reports/

  # ─────────────────────────────────────────────────────────────
  # CI — Backend : planning-service
  # ─────────────────────────────────────────────────────────────
  test-planning-service:
    name: "CI - planning-service (tests + JaCoCo)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests + coverage
        run: mvn verify -B
        working-directory: Backend/planning-service

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-planning-service
          path: Backend/planning-service/target/site/jacoco/

      - name: Upload Surefire report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-planning-service
          path: Backend/planning-service/target/surefire-reports/

  # ─────────────────────────────────────────────────────────────
  # CI — Frontend Angular
  # ─────────────────────────────────────────────────────────────
  test-frontend:
    name: "CI - Frontend Angular (Karma/Jasmine)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Frontend/angular-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: Frontend/angular-app

      - name: Run tests
        run: npm test -- --watch=false --browsers=ChromeHeadless --no-progress
        working-directory: Frontend/angular-app

  # ─────────────────────────────────────────────────────────────
  # CD — Docker Build (après tous les tests)
  # ─────────────────────────────────────────────────────────────
  docker-build:
    name: "CD - Docker Build (tous les services)"
    runs-on: ubuntu-latest
    needs:
      - test-event-service
      - test-training-service
      - test-course-service
      - test-exam-service
      - test-planning-service
      - test-frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build eureka-server
        run: docker build -t smartek/eureka-server:latest ./Backend/eureka-server

      - name: Build config-server
        run: docker build -t smartek/config-server:latest ./Backend/config-server

      - name: Build auth-service
        run: docker build -t smartek/auth-service:latest ./Backend/auth-service

      - name: Build course-service
        run: docker build -t smartek/course-service:latest ./Backend/course-service

      - name: Build exam-service
        run: docker build -t smartek/exam-service:latest ./Backend/exam-service

      - name: Build planning-service
        run: docker build -t smartek/planning-service:latest ./Backend/planning-service

      - name: Build training-service
        run: docker build -t smartek/training-service:latest ./Backend/training-service

      - name: Build event-service
        run: docker build -t smartek/event-service:latest ./Backend/event-service

      - name: Build offers-service
        run: docker build -t smartek/offers-service:latest ./Backend/offers-service

      - name: Build api-gateway
        run: docker build -t smartek/api-gateway:latest ./Backend/api-gateway

      - name: Build frontend
        run: docker build -t smartek/frontend:latest ./Frontend/angular-app

      - name: Verify all images built
        run: docker images | grep smartek

  # ─────────────────────────────────────────────────────────────
  # CI — Validation config Prometheus & Grafana
  # ─────────────────────────────────────────────────────────────
  monitoring-check:
    name: "CI - Validation config Prometheus & Grafana"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier que prometheus.yml existe
        run: |
          test -f monitoring/prometheus/prometheus.yml && echo "✅ prometheus.yml trouvé" || (echo "❌ prometheus.yml manquant" && exit 1)

      - name: Valider la syntaxe prometheus.yml avec promtool
        run: |
          # Télécharger Prometheus pour avoir promtool
          PROM_VERSION="2.51.2"
          wget -q https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/prometheus-${PROM_VERSION}.linux-amd64.tar.gz
          tar -xzf prometheus-${PROM_VERSION}.linux-amd64.tar.gz
          ./prometheus-${PROM_VERSION}.linux-amd64/promtool check config monitoring/prometheus/prometheus.yml
          echo "✅ prometheus.yml syntaxe valide"

      - name: Vérifier les fichiers Grafana
        run: |
          test -f monitoring/grafana/provisioning/datasources/prometheus.yml && echo "✅ datasource Grafana trouvée" || (echo "❌ datasource Grafana manquante" && exit 1)
          test -f monitoring/grafana/provisioning/dashboards/dashboard.yml   && echo "✅ provider dashboards trouvé"  || (echo "❌ provider dashboards manquant" && exit 1)
          test -f monitoring/grafana/provisioning/dashboards/smartek-overview.json && echo "✅ dashboard JSON trouvé" || (echo "❌ dashboard JSON manquant" && exit 1)

      - name: Valider le JSON du dashboard Grafana
        run: |
          python3 -c "
          import json, sys
          with open('monitoring/grafana/provisioning/dashboards/smartek-overview.json') as f:
              json.load(f)
          print('✅ Dashboard JSON valide')
          "

      - name: Vérifier que les services exposent /actuator/prometheus dans application.yml
        run: |
          SERVICES="auth-service course-service exam-service event-service planning-service training-service"
          for svc in $SERVICES; do
            FILE=$(find Backend/$svc/src/main/resources -name "application.yml" | head -1)
            if grep -q "prometheus" "$FILE"; then
              echo "✅ $svc : /actuator/prometheus configuré"
            else
              echo "❌ $svc : /actuator/prometheus MANQUANT dans $FILE"
              exit 1
            fi
          done

  # ─────────────────────────────────────────────────────────────
  # CD — Deploy Monitoring (Prometheus + Grafana)
  # ─────────────────────────────────────────────────────────────
  deploy-monitoring:
    name: "CD - Deploy Prometheus + Grafana"
    runs-on: ubuntu-latest
    needs:
      - docker-build
      - monitoring-check

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Démarrer Prometheus + Grafana
        run: |
          docker compose up -d prometheus grafana
          echo "⏳ Attente démarrage Prometheus et Grafana..."
          sleep 20

      - name: Vérifier que Prometheus est UP
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:9090/-/healthy)
          if [ "$STATUS" = "200" ]; then
            echo "✅ Prometheus UP (HTTP $STATUS)"
          else
            echo "❌ Prometheus DOWN (HTTP $STATUS)"
            docker compose logs prometheus
            exit 1
          fi

      - name: Vérifier que Grafana est UP
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/health)
          if [ "$STATUS" = "200" ]; then
            echo "✅ Grafana UP (HTTP $STATUS)"
          else
            echo "❌ Grafana DOWN (HTTP $STATUS)"
            docker compose logs grafana
            exit 1
          fi

      - name: Vérifier que la datasource Prometheus est chargée dans Grafana
        run: |
          RESULT=$(curl -s -u admin:smartek123 http://localhost:3000/api/datasources)
          if echo "$RESULT" | grep -q "Prometheus"; then
            echo "✅ Datasource Prometheus chargée dans Grafana"
          else
            echo "❌ Datasource Prometheus non trouvée"
            echo "$RESULT"
            exit 1
          fi

      - name: Afficher les logs en cas d'échec
        if: failure()
        run: |
          echo "=== Logs Prometheus ==="
          docker compose logs prometheus --tail=50
          echo "=== Logs Grafana ==="
          docker compose logs grafana --tail=50

  # ─────────────────────────────────────────────────────────────
  # Résumé final
  # ─────────────────────────────────────────────────────────────
  pipeline-success:
    name: "Pipeline complet OK"
    runs-on: ubuntu-latest
    needs:
      - docker-build
      - deploy-monitoring
    steps:
      - name: Summary
        run: |
          echo "✅ CI  : Tests + JaCoCo coverage OK (event / training / course / exam / planning / frontend)"
          echo "✅ CI  : Config Prometheus & Grafana validée"
          echo "✅ CD  : Docker build OK (11 microservices)"
          echo "✅ CD  : Prometheus UP sur :9090"
          echo "✅ CD  : Grafana UP sur :3000"
          echo "📦 Artifacts : rapports JaCoCo disponibles dans les artifacts GitHub Actions"
