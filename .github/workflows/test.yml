name: CI - Certification and Badge Service Tests

on:
  push:
    branches:
      - certificates-badges-service
      - main
  pull_request:
    branches:
      - main

jobs:

  backend-tests:
    name: Backend Tests (Java 17 / Maven)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run backend unit tests
        working-directory: Backend/certification-badge-service
        run: mvn test --batch-mode --no-transfer-progress -Dspring.profiles.active=test

      - name: Upload Surefire test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: Backend/certification-badge-service/target/surefire-reports/

  frontend-tests:
    name: Frontend Tests (Node 18 / Angular / ChromeHeadless)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: Frontend/angular-app/package-lock.json

      - name: Install dependencies
        working-directory: Frontend/angular-app
        run: npm ci

      - name: Run frontend unit tests
        working-directory: Frontend/angular-app
        run: npx ng test --watch=false --browsers=ChromeHeadless --no-progress --include=src/app/core/services --include=src/app/features/certifications-badges

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-report
          path: Frontend/angular-app/coverage/
