name: CD Docker

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options: [staging, production]

jobs:
  build-and-push:
    name: "Build & Push ${{ matrix.service.name }}"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: eureka-server
            context: Backend/eureka-server
          - name: config-server
            context: Backend/config-server
          - name: api-gateway
            context: Backend/api-gateway
          - name: auth-service
            context: Backend/auth-service
          - name: event-service
            context: Backend/event-service
          - name: planning-service
            context: Backend/planning-service
          - name: training-service
            context: Backend/training-service
          - name: offers-service
            context: Backend/offers-service
          - name: course-service
            context: Backend/course-service
          - name: exam-service
            context: Backend/exam-service
          - name: skill-evidence-service
            context: Backend/skiil-evidence-service
          - name: learning-service
            context: Backend/learning
          - name: sponsor-service
            context: Backend/smartek_sponsor
          - name: certification-badge-service
            context: Backend/certification-badge-service
          - name: frontend
            context: Frontend/angular-app
      fail-fast: false

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service.name }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy security scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}/${{ matrix.service.name }}:sha-${{ github.sha }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
        continue-on-error: true
