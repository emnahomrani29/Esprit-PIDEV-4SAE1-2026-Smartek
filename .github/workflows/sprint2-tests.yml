name: Sprint 2 - Security & Tests

on:
  push:
    branches:
      - event/planning-service
      - training-cours-exams-service
  pull_request:
    branches:
      - main
      - event/planning-service
      - training-cours-exams-service

jobs:

  # ─── Backend : course-service ─────────────────────────────────────────────
  test-course-service:
    name: "Backend - course-service"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: mvn test -B
        working-directory: Backend/course-service

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: course-service-test-report
          path: Backend/course-service/target/surefire-reports/

  # ─── Backend : exam-service ───────────────────────────────────────────────
  test-exam-service:
    name: "Backend - exam-service"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: mvn test -B
        working-directory: Backend/exam-service

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exam-service-test-report
          path: Backend/exam-service/target/surefire-reports/

  # ─── Backend : planning-service ───────────────────────────────────────────
  test-planning-service:
    name: "Backend - planning-service"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: mvn test -B
        working-directory: Backend/planning-service

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: planning-service-test-report
          path: Backend/planning-service/target/surefire-reports/

  # ─── Frontend : Angular / Karma ───────────────────────────────────────────
  test-frontend:
    name: "Frontend - Angular (Karma/Jasmine)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Frontend/angular-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: Frontend/angular-app

      - name: Run tests
        run: npm test -- --watch=false --browsers=ChromeHeadless --no-progress
        working-directory: Frontend/angular-app

  # ─── Résumé global ────────────────────────────────────────────────────────
  all-tests-passed:
    name: "All tests passed"
    runs-on: ubuntu-latest
    needs:
      - test-course-service
      - test-exam-service
      - test-planning-service
      - test-frontend

    steps:
      - name: All checks passed
        run: echo "✅ Tous les tests Backend et Frontend sont passés avec succès !"
