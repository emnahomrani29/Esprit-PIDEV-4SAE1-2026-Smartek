apiVersion: apps/v1
kind: Deployment
metadata:
  name: skill-evidence-service
  namespace: smartek
  labels:
    app: skill-evidence-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: skill-evidence-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: skill-evidence-service
    spec:
      containers:
        - name: skill-evidence-service
          image: wafachabbi/skill-evidence-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8091
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms256m -Xmx512m"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql-service:3306/skill-db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: password
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://eureka-server:8761/eureka/"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: secret
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8091
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 10
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8091
            failureThreshold: 90
            periodSeconds: 15
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "768Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: skill-evidence-service
  namespace: smartek
  labels:
    app: skill-evidence-service
spec:
  selector:
    app: skill-evidence-service
  ports:
    - protocol: TCP
      port: 8091
      targetPort: 8091
      nodePort: 30091
  type: NodePort
