apiVersion: v1
kind: ServiceAccount
metadata:
  name: smartek-backend-sa
  namespace: smartek
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: smartek-backend-role
  namespace: smartek
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: smartek-backend-rolebinding
  namespace: smartek
subjects:
- kind: ServiceAccount
  name: smartek-backend-sa
  namespace: smartek
roleRef:
  kind: Role
  name: smartek-backend-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: smartek-monitoring-sa
  namespace: smartek
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: smartek-monitoring-role
rules:
- apiGroups: [""]
  resources:
  - nodes
  - nodes/proxy
  - services
  - endpoints
  - pods
  verbs: ["get", "list", "watch"]
- apiGroups:
  - extensions
  resources:
  - ingresses
  verbs: ["get", "list", "watch"]
- nonResourceURLs: ["/metrics"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: smartek-monitoring-rolebinding
subjects:
- kind: ServiceAccount
  name: smartek-monitoring-sa
  namespace: smartek
roleRef:
  kind: ClusterRole
  name: smartek-monitoring-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: smartek-admin-sa
  namespace: smartek
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: smartek-admin-role
  namespace: smartek
rules:
- apiGroups: ["*"]
  resources: ["*"]
  verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: smartek-admin-rolebinding
  namespace: smartek
subjects:
- kind: ServiceAccount
  name: smartek-admin-sa
  namespace: smartek
roleRef:
  kind: Role
  name: smartek-admin-role
  apiGroup: rbac.authorization.k8s.io
