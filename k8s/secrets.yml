# Apply this manually on the cluster — do NOT commit real credentials to git
# Run: kubectl apply -f k8s/secrets.yml
#
# Values below are base64 encoded. To encode your own:
#   echo -n 'yourvalue' | base64
#
# Defaults here: username=root, password=root, jwt secret=smartek-secret-key-...
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: smartek
type: Opaque
data:
  username: cm9vdA==      # root
  password: cm9vdA==      # root
