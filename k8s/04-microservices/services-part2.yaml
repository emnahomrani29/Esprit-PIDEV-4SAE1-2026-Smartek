  name: course-service
  namespace: smartek
spec:
  type: ClusterIP
  ports:
  - port: 8086
    targetPort: 8086
  selector:
    app: course-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: course-service
  namespace: smartek
spec:
  replicas: 1
  selector:
    matchLabels:
      app: course-service
  template:
    metadata:
      labels:
        app: course-service
    spec:
      containers:
      - name: course-service
        image: your-docker-registry/smartek/course-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8086
        env:
        - name: SERVER_PORT
          value: "8086"
        - name: SPRING_APPLICATION_NAME
          value: "course-service"
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:mysql://mysql-service.smartek.svc.cluster.local:3306/course_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: smartek-db-credentials
              key: SPRING_DATASOURCE_USERNAME
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: smartek-db-credentials
              key: SPRING_DATASOURCE_PASSWORD
        - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
          valueFrom:
            configMapKeyRef:
              name: smartek-config
              key: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        volumeMounts:
        - name: uploads
          mountPath: /uploads
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8086
          initialDelaySeconds: 40
          periodSeconds: 10
      volumes:
      - name: uploads
        emptyDir: {}
