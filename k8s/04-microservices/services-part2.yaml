---
# EXAM SERVICE
apiVersion: v1
kind: Service
metadata:
  name: exam-service
  namespace: smartek
spec:
  type: ClusterIP
  ports:
  - port: 8087
    targetPort: 8087
  selector:
    app: exam-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exam-service
  namespace: smartek
spec:
  replicas: 1
  selector:
    matchLabels:
      app: exam-service
  template:
    metadata:
      labels:
        app: exam-service
    spec:
      containers:
      - name: exam-service
        image: your-docker-registry/smartek/exam-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8087
        env:
        - name: SERVER_PORT
          value: "8087"
        - name: SPRING_APPLICATION_NAME
          value: "exam-service"
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:mysql://mysql-service.smartek.svc.cluster.local:3306/exam_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: smartek-db-credentials
              key: SPRING_DATASOURCE_USERNAME
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: smartek-db-credentials
              key: SPRING_DATASOURCE_PASSWORD
        - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
          valueFrom:
            configMapKeyRef:
              name: smartek-config
              key: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8087
          initialDelaySeconds: 40
          periodSeconds: 10
---
# COURSE SERVICE
apiVersion: v1
kind: Service
