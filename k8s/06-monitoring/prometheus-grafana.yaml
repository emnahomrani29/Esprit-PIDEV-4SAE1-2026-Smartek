apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: smartek
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    alerting:
      alertmanagers:
      - static_configs:
        - targets: ['alertmanager:9093']

    rule_files:
      - /etc/prometheus/alerts.yml

    scrape_configs:
    - job_name: 'prometheus'
      static_configs:
      - targets: ['localhost:9090']
    - job_name: 'eureka'
      static_configs:
      - targets: ['eureka-server:8761']
    - job_name: 'auth-service'
      metrics_path: '/actuator/prometheus'
      static_configs:
      - targets: ['auth-service:8081']
    - job_name: 'event-service'
      metrics_path: '/actuator/prometheus'
      static_configs:
      - targets: ['event-service:8082']
    - job_name: 'planning-service'
      metrics_path: '/actuator/prometheus'
      static_configs:
      - targets: ['planning-service:8083']
    - job_name: 'training-service'
      metrics_path: '/actuator/prometheus'
      static_configs:
      - targets: ['training-service:8084']
    - job_name: 'offers-service'
      metrics_path: '/actuator/prometheus'
      static_configs:
      - targets: ['offers-service:8085']
    - job_name: 'course-service'
      metrics_path: '/actuator/prometheus'
      static_configs:
      - targets: ['course-service:8086']
    - job_name: 'exam-service'
      metrics_path: '/actuator/prometheus'
      static_configs:
      - targets: ['exam-service:8087']
    - job_name: 'skill-evidence-service'
      metrics_path: '/actuator/prometheus'
      static_configs:
      - targets: ['skill-evidence-service:8091']
    - job_name: 'learning-service'
      metrics_path: '/actuator/prometheus'
      static_configs:
      - targets: ['learning-service:8092']
    - job_name: 'api-gateway'
      metrics_path: '/actuator/prometheus'
      static_configs:
      - targets: ['api-gateway:8090']

  alerts.yml: |
    groups:
    - name: smartek-services
      rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} est DOWN"
          description: "Le service {{ $labels.job }} ne repond plus depuis 1 minute."
      - alert: HighMemoryUsage
        expr: jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"} > 0.85
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Memoire JVM elevee sur {{ $labels.job }}"
          description: "Heap JVM > 85% depuis 2 minutes sur {{ $labels.job }}."
      - alert: HighErrorRate
        expr: rate(http_server_requests_seconds_count{status=~"5.."}[5m]) > 0.1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Taux d erreurs eleve sur {{ $labels.job }}"
          description: "Plus de 10% de requetes en erreur 5xx sur {{ $labels.job }}."

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: smartek
spec:
  type: ClusterIP
  ports:
  - port: 9090
    targetPort: 9090
  selector:
    app: prometheus
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: smartek
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:latest
        ports:
        - containerPort: 9090
        args:
          - '--config.file=/etc/prometheus/prometheus.yml'
          - '--storage.tsdb.path=/prometheus'
        volumeMounts:
        - name: prometheus-config
          mountPath: /etc/prometheus
        - name: prometheus-storage
          mountPath: /prometheus
          subPath: prometheus
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "300m"
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: 9090
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: prometheus-config
        configMap:
          name: prometheus-config
      - name: prometheus-storage
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: smartek
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
  selector:
    app: grafana
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: smartek
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:10.4.0
        ports:
        - containerPort: 3000
        env:
        - name: GF_SECURITY_ADMIN_USER
          value: "admin"
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: grafana-admin
              key: password
        volumeMounts:
        - name: grafana-storage
          mountPath: /var/lib/grafana
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: grafana-storage
        emptyDir: {}
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: smartek
type: Opaque
stringData:
  password: "admin123"
