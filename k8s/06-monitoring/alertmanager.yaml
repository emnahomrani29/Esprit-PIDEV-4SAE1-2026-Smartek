---
# ConfigMap Alertmanager
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: smartek
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    route:
      group_by: ['alertname', 'job']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 1h
      receiver: 'default'

    receivers:
    - name: 'default'
      webhook_configs:
      - url: 'http://localhost:5001/'
        send_resolved: true

---
# ConfigMap alerting rules
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alerts
  namespace: smartek
data:
  alerts.yml: |
    groups:
    - name: smartek-services
      rules:

      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} est DOWN"
          description: "Le service {{ $labels.job }} ne répond plus depuis 1 minute."

      - alert: HighCPUUsage
        expr: process_cpu_usage > 0.8
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "CPU élevé sur {{ $labels.job }}"
          description: "CPU usage > 80% depuis 2 minutes sur {{ $labels.job }}."

      - alert: HighMemoryUsage
        expr: jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"} > 0.85
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Mémoire JVM élevée sur {{ $labels.job }}"
          description: "Heap JVM > 85% depuis 2 minutes sur {{ $labels.job }}."

      - alert: HighErrorRate
        expr: rate(http_server_requests_seconds_count{status=~"5.."}[5m]) > 0.1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Taux d'erreurs élevé sur {{ $labels.job }}"
          description: "Plus de 10% de requêtes en erreur 5xx sur {{ $labels.job }}."

      - alert: HighLatency
        expr: http_server_requests_seconds{quantile="0.95"} > 2
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Latence élevée sur {{ $labels.job }}"
          description: "P95 latency > 2s depuis 2 minutes sur {{ $labels.job }}."

---
# Deployment Alertmanager
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: smartek
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      containers:
      - name: alertmanager
        image: prom/alertmanager:latest
        ports:
        - containerPort: 9093
        args:
          - '--config.file=/etc/alertmanager/alertmanager.yml'
          - '--storage.path=/alertmanager'
        volumeMounts:
        - name: alertmanager-config
          mountPath: /etc/alertmanager
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: 9093
          initialDelaySeconds: 20
          periodSeconds: 10
      volumes:
      - name: alertmanager-config
        configMap:
          name: alertmanager-config

---
# Service Alertmanager
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: smartek
spec:
  type: NodePort
  ports:
  - port: 9093
    targetPort: 9093
    nodePort: 30093
  selector:
    app: alertmanager
