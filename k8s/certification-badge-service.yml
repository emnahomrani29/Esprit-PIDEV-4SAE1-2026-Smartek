apiVersion: v1
kind: Service
metadata:
  name: certification-badge-service
  namespace: smartek
spec:
  type: NodePort
  ports:
  - port: 8089
    targetPort: 8089
    nodePort: 30089
    protocol: TCP
  selector:
    app: certification-badge-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: certification-badge-service
  namespace: smartek
spec:
  replicas: 1
  selector:
    matchLabels:
      app: certification-badge-service
  template:
    metadata:
      labels:
        app: certification-badge-service
    spec:
      containers:
      - name: certification-badge-service
        image: wafachabbi/certification-badge-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8089
        env:
        - name: SERVER_PORT
          value: "8089"
        - name: SPRING_APPLICATION_NAME
          value: "certification-badge-service"
        - name: JAVA_TOOL_OPTIONS
          value: "-Xms256m -Xmx512m"
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:mysql://mysql-service:3306/smartek_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: username
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: password
        - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
          value: "http://eureka-server:8761/eureka/"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: jwt-secret
              key: secret
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "768Mi"
            cpu: "500m"
        startupProbe:
          httpGet:
            path: /actuator/health
            port: 8089
          failureThreshold: 90
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8089
          initialDelaySeconds: 60
          periodSeconds: 20
          failureThreshold: 10
