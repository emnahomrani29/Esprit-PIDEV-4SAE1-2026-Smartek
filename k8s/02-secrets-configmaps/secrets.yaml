apiVersion: v1
kind: Secret
metadata:
  name: smartek-db-credentials
  namespace: smartek
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "root"
  MYSQL_USER: "smartek_user"
  MYSQL_PASSWORD: "smartek_pass123"
  SPRING_DATASOURCE_USERNAME: "smartek_user"
  SPRING_DATASOURCE_PASSWORD: "smartek_pass123"
---
apiVersion: v1
kind: Secret
metadata:
  name: smartek-jwt-secret
  namespace: smartek
type: Opaque
stringData:
  JWT_SECRET: "smartek-jwt-secret-key-change-in-production"
  JWT_EXPIRATION_TIME: "86400000"
---
