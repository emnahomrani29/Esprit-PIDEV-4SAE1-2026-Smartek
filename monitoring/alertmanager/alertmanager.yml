global:
  resolve_timeout: 5m
  # Configuration SMTP pour les notifications email
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'smartek-alerts@gmail.com'
  smtp_auth_username: '${ALERT_EMAIL_USER}'
  smtp_auth_password: '${ALERT_EMAIL_PASSWORD}'
  smtp_require_tls: true

# Templates de notification
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# Arbre de routage des alertes
route:
  group_by: ['alertname', 'job', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default-receiver'

  routes:
    # Alertes critiques → notification immédiate
    - match:
        severity: critical
      receiver: 'critical-receiver'
      group_wait: 10s
      repeat_interval: 1h

    # Alertes warning → notification groupée
    - match:
        severity: warning
      receiver: 'warning-receiver'
      group_wait: 1m
      repeat_interval: 4h

    # Alertes base de données
    - match:
        job: mysql
      receiver: 'database-receiver'
      group_wait: 30s

receivers:
  # Récepteur par défaut (email)
  - name: 'default-receiver'
    email_configs:
      - to: 'team@smartek.com'
        subject: '[Smartek] Alert: {{ .GroupLabels.alertname }}'
        body: |
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Service: {{ .Labels.job }}
          Severity: {{ .Labels.severity }}
          {{ end }}

  # Alertes critiques
  - name: 'critical-receiver'
    email_configs:
      - to: 'team@smartek.com'
        subject: '[CRITICAL] Smartek: {{ .GroupLabels.alertname }}'
        send_resolved: true

  # Alertes warning
  - name: 'warning-receiver'
    email_configs:
      - to: 'team@smartek.com'
        subject: '[WARNING] Smartek: {{ .GroupLabels.alertname }}'
        send_resolved: true

  # Alertes base de données
  - name: 'database-receiver'
    email_configs:
      - to: 'team@smartek.com'
        subject: '[DB] Smartek MySQL: {{ .GroupLabels.alertname }}'
        send_resolved: true

# Inhibition : supprimer les warnings si le service est déjà en critical
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'job']
