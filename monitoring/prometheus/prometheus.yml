global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'smartek-monitor'

scrape_configs:

  # Prometheus lui-même
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # API Gateway
  - job_name: 'api-gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['api-gateway:8090']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'api-gateway'

  # Auth Service
  - job_name: 'auth-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['auth-service:8081']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'auth-service'

  # Event Service
  - job_name: 'event-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['event-service:8082']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'event-service'

  # Planning Service
  - job_name: 'planning-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['planning-service:8083']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'planning-service'

  # Training Service
  - job_name: 'training-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['training-service:8084']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'training-service'

  # Course Service
  - job_name: 'course-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['course-service:8086']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'course-service'

  # Exam Service
  - job_name: 'exam-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['exam-service:8087']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'exam-service'
